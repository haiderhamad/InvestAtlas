<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InvestAtlas · Gold and silver history</title>
  <style>
    :root { color-scheme: dark; background: #0a111a; color: #f0f4ff; font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: 100%; max-width: 1200px; margin: 0 auto; padding: 42px 56px 34px; }
    h1 { max-width: 940px; margin: 0; font-size: 64px; font-weight: 700; line-height: 1.05; letter-spacing: -0.035em; text-wrap: balance; }
    .intro { max-width: 1000px; margin: 14px 0 32px; color: #cad5e8; font-size: 21px; line-height: 1.5; }
    .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 454px)); gap: 64px; justify-content: center; align-items: start; }
    figure { min-width: 0; margin: 0; }
    figcaption { margin: 0 0 17px; padding-left: 6px; font-size: 22px; font-weight: 650; letter-spacing: -0.015em; line-height: 1.4; }
    figcaption span { display: block; margin-top: 3px; color: #cad5e8; font-size: 14px; font-weight: 400; letter-spacing: 0; }
    .gold figcaption { color: #e4c67e; }
    .silver figcaption { color: #c2d0e6; }
    .phone { width: 100%; padding: 3px; border-radius: 54px; background: linear-gradient(140deg, #8c7b51, #dacb9e 34%, #675b40 68%, #afa17d); box-shadow: 0 24px 56px rgba(0, 0, 0, 0.42); }
    .silver .phone { background: linear-gradient(140deg, #718298, #c5ced8 34%, #465468 68%, #9cabbc); }
    .shell { position: relative; padding: 28px 9px 15px; border-radius: 51px; background: #060a10; }
    .shell::before { position: absolute; top: 12px; left: calc(50% - 45px); width: 90px; height: 5px; border-radius: 9px; background: #293240; content: ""; }
    .screen { overflow: hidden; border-radius: 32px; background: #0a111a; }
    .screen img { display: block; width: 100%; height: auto; aspect-ratio: 430 / 932; }
    .capture-note { margin: 31px 0 0; color: #cad5e8; font-size: 15px; line-height: 1.6; }
    .sources { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 28px; margin-top: 10px; color: #cad5e8; font-size: 15px; line-height: 1.6; }
    a { color: #9dc6ff; text-underline-offset: 4px; }
    a:focus-visible { outline: 2px solid #9dc6ff; outline-offset: 5px; }
    ::selection { background: #9dc6ff; color: #0a111a; }
    @media (max-width: 1050px) {
      main { padding: 36px 24px; }
      h1 { font-size: clamp(38px, 6vw, 60px); }
      .pair { gap: 42px; }
    }
    @media (max-width: 700px) {
      .intro { font-size: 18px; margin-bottom: 34px; }
      .pair { grid-template-columns: minmax(0, 454px); }
      .phone { border-radius: 42px; }
      .shell { border-radius: 39px; }
      .screen { border-radius: 24px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Gold and silver over five years</h1>
    <p class="intro">Spot prices per fine gram, alongside 595 historical closes for each metal.</p>
    <div class="pair">
      <figure class="gold">
        <figcaption>Gold · Deutsch<span>Indicative closes through November 15, 2026</span></figcaption>
        <div class="phone"><div class="shell"><div class="screen"><img src="gold-mobile-de.png" width="430" height="932" alt="German dark-theme chart with a gold price of EUR 112.87 per fine gram and five years of partial history"></div></div></div>
      </figure>
      <figure class="silver">
        <figcaption>Silver · <bdi lang="ar">العربية</bdi><span>Indicative closes through November 16, 2026</span></figcaption>
        <div class="phone"><div class="shell"><div class="screen"><img src="silver-mobile-ar.png" width="430" height="932" alt="Arabic light-theme chart with a silver price of EUR 1.3836 per fine gram and five years of partial history"></div></div></div>
      </figure>
    </div>
    <p class="capture-note">November 17, 2026 · Chrome with iPhone viewport emulation · 430 × 932 CSS pixels per screen</p>
    <div class="sources"><span>History: <a href="https://standardbullion.com/market-data">Data by Standard Bullion</a></span><span>Indicative spot: Gold API · Reference FX: ECB</span></div>
  </main>
</body>
</html>
